name: Compilar Mythic Realms

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Compilar Mythic Realms
        run: gradle --no-daemon build

      - name: Subir JAR instalable
        uses: actions/upload-artifact@v4
        with:
          name: MythicRealms-Fabric-1.21.1-0.2.1
          path: build/libs/mythicrealms-0.2.1.jar
          if-no-files-found: error
          retention-days: 30
