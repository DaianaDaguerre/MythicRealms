name: Compilar Mythic Realms

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Validar los ocho pelajes y la estructura
        run: python3 scripts/validate_assets.py
      - name: Compilar el mod
        run: gradle --no-daemon build
      - name: Comprobar el JAR de Minecraft
        run: test -f build/libs/mythicrealms-0.2.4.jar
      - name: Descargar JAR instalable
        uses: actions/upload-artifact@v4
        with:
          name: MythicRealms-0.2.4-Fabric-1.21.1
          path: build/libs/mythicrealms-0.2.4.jar
          if-no-files-found: error
